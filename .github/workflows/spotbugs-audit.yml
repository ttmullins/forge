name: SpotBugs audit

on:
  push:
    branches:
      - audit/2026-09-dev-sweep-2

jobs:
  audit:
    if: contains(github.event.head_commit.message, 'Run SpotBugs high-confidence audit')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile project
        run: mvn -U -B -DskipTests package
      - name: Run SpotBugs
        shell: bash
        run: |
          set +e
          mvn -B -DskipTests -Dspotbugs.effort=Max -Dspotbugs.threshold=High \
            com.github.spotbugs:spotbugs-maven-plugin:4.9.3.0:spotbugs
          rc=$?
          echo "spotbugs_exit=$rc"
          find . -path '*/target/spotbugsXml.xml' -print > /tmp/spotbugs-files.txt
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          rows=[]
          for f in Path('.').rglob('spotbugsXml.xml'):
              try: root=ET.parse(f).getroot()
              except Exception as e:
                  rows.append(f'PARSE_ERROR|{f}|{e}')
                  continue
              for bug in root.findall('.//BugInstance'):
                  pr=bug.get('priority','')
                  rank=bug.get('rank','')
                  typ=bug.get('type','')
                  cat=bug.get('category','')
                  cls=bug.find('Class')
                  src=bug.find('SourceLine')
                  msg=bug.findtext('LongMessage') or bug.findtext('ShortMessage') or ''
                  cname=cls.get('classname','') if cls is not None else ''
                  source=src.get('sourcepath','') if src is not None else ''
                  line=src.get('start','') if src is not None else ''
                  rows.append(f'{pr}|{rank}|{cat}|{typ}|{cname}|{source}:{line}|{msg}')
          rows.sort()
          Path('spotbugs-high-audit.txt').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          print(f'findings={len(rows)}')
          for r in rows[:500]: print(r)
          PY
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: spotbugs-high-audit
          path: spotbugs-high-audit.txt
