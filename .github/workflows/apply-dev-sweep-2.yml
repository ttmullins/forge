name: Apply second dev audit fixes

on:
  push:
    branches:
      - audit/2026-09-dev-sweep-2

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ contains(github.event.head_commit.message, 'Run second dev audit fixer') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/2026-09-dev-sweep-2
          fetch-depth: 0

      - name: Apply verified issue 11670 patch
        shell: bash
        run: |
          curl -fL --retry 3 'https://github.com/user-attachments/files/31355372/fix-malformed-tmx-dialog-json.patch' -o /tmp/issue-11670.patch
          test -s /tmp/issue-11670.patch
          git apply --check /tmp/issue-11670.patch
          git apply /tmp/issue-11670.patch

      - name: Apply audited correctness fixes
        run: python3 .github/scripts/apply_dev_sweep_2.py

      - name: Validate resource containers and diff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          failures = []
          count = 0
          for ext in ('*.xml', '*.tmx', '*.tsx'):
              for p in Path('.').rglob(ext):
                  if '.git' in p.parts or 'target' in p.parts:
                      continue
                  count += 1
                  try:
                      ET.parse(p)
                  except Exception as e:
                      failures.append(f'{p}: {e}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print(f'Validated {count} XML/TMX/TSX resources')
          PY
          git diff --check
          git diff --name-only | grep -v '^\.github/' || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Full Maven test build on Java 17
        shell: bash
        run: |
          export DISPLAY=:97
          Xvfb :97 -screen 0 1024x768x24 >/tmp/xvfb17.log 2>&1 &
          xvfb_pid=$!
          trap 'kill $xvfb_pid 2>/dev/null || true' EXIT
          mvn -U -B clean test

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Full Maven test build on Java 21
        shell: bash
        run: |
          export DISPLAY=:98
          Xvfb :98 -screen 0 1024x768x24 >/tmp/xvfb21.log 2>&1 &
          xvfb_pid=$!
          trap 'kill $xvfb_pid 2>/dev/null || true' EXIT
          mvn -U -B clean test

      - name: Commit validated product fixes
        shell: bash
        run: |
          rm -f .github/workflows/dev-static-audit.yml
          rm -f .github/workflows/fetch-11670-patch.yml
          rm -f .github/workflows/deep-resource-audit.yml
          rm -f .github/workflows/libgdx-json-audit.yml
          rm -f .github/workflows/spotbugs-audit.yml
          rm -f .github/workflows/apply-dev-sweep-2.yml
          rm -f .github/scripts/apply_dev_sweep_2.py
          rmdir .github/scripts 2>/dev/null || true
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix second dev audit correctness and resource findings'
          git push origin HEAD:audit/2026-09-dev-sweep-2
