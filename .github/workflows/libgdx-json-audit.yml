name: LibGDX JSON audit

on:
  push:
    branches:
      - audit/2026-09-dev-sweep-2

jobs:
  audit:
    if: contains(github.event.head_commit.message, 'Run LibGDX parser audit')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build LibGDX dependency classpath
        shell: bash
        run: |
          mvn -q -pl forge-gui-mobile -am -DskipTests package
          mvn -q -pl forge-gui-mobile dependency:build-classpath -Dmdep.outputFile=/tmp/gdx-cp.txt
      - name: Parse resources with Forge's LibGDX JSON parser
        shell: bash
        run: |
          cat > /tmp/LibGdxJsonAudit.java <<'JAVA'
          import com.badlogic.gdx.utils.JsonReader;
          import java.nio.file.*;
          import java.util.*;
          import javax.xml.parsers.*;
          import org.w3c.dom.*;

          public class LibGdxJsonAudit {
              static final List<String> failures = new ArrayList<>();
              static final JsonReader parser = new JsonReader();
              static int standalone = 0, embedded = 0;

              public static void main(String[] args) throws Exception {
                  try (var paths = Files.walk(Path.of("."))) {
                      paths.filter(p -> p.toString().endsWith(".json"))
                           .filter(p -> !p.toString().contains("/target/") && !p.toString().contains("/.git/"))
                           .forEach(p -> {
                               standalone++;
                               try { parser.parse(Files.readString(p)); }
                               catch (Exception e) { failures.add("JSON|" + p + "|" + oneLine(e)); }
                           });
                  }

                  DocumentBuilderFactory f = DocumentBuilderFactory.newInstance();
                  f.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
                  try (var paths = Files.walk(Path.of("."))) {
                      paths.filter(p -> p.toString().endsWith(".tmx"))
                           .filter(p -> !p.toString().contains("/target/") && !p.toString().contains("/.git/"))
                           .forEach(p -> {
                               try {
                                   Document d = f.newDocumentBuilder().parse(p.toFile());
                                   NodeList props = d.getElementsByTagName("property");
                                   for (int i = 0; i < props.getLength(); i++) {
                                       Element el = (Element) props.item(i);
                                       String s = el.getTextContent() == null ? "" : el.getTextContent().trim();
                                       if (s.isEmpty() || (s.charAt(0) != '{' && s.charAt(0) != '[')) continue;
                                       embedded++;
                                       try { parser.parse(s); }
                                       catch (Exception e) {
                                           failures.add("EMBEDDED_JSON|" + p + "|property=" + el.getAttribute("name") + "|" + oneLine(e));
                                       }
                                   }
                               } catch (Exception e) {
                                   failures.add("TMX_XML|" + p + "|" + oneLine(e));
                               }
                           });
                  }
                  Collections.sort(failures);
                  StringBuilder out = new StringBuilder();
                  out.append("SCANNED standalone_json=").append(standalone)
                     .append(" embedded_json_properties=").append(embedded).append('\n');
                  out.append("FAILURES:\n");
                  for (String x : failures) out.append(x).append('\n');
                  out.append("SUMMARY failures=").append(failures.size()).append('\n');
                  Files.writeString(Path.of("libgdx-json-audit.txt"), out.toString());
                  System.out.print(out);
              }
              static String oneLine(Exception e) {
                  String s = String.valueOf(e.getMessage());
                  int n = s.indexOf('\n');
                  return n >= 0 ? s.substring(0, n) : s;
              }
          }
          JAVA
          CP="forge-gui-mobile/target/classes:$(cat /tmp/gdx-cp.txt)"
          javac -cp "$CP" /tmp/LibGdxJsonAudit.java
          java -cp "/tmp:$CP" LibGdxJsonAudit
      - uses: actions/upload-artifact@v4
        with:
          name: libgdx-json-audit
          path: libgdx-json-audit.txt
