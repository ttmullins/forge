name: Dev static audit

on:
  push:
    branches:
      - audit/2026-09-dev-sweep-2

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resource validation and focused Java scan
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, xml.etree.ElementTree as ET

          root = Path('.')
          findings = []
          errors = []

          # Parse every JSON resource.
          json_count = 0
          for p in root.rglob('*.json'):
              if '.git' in p.parts or 'target' in p.parts:
                  continue
              json_count += 1
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  errors.append(f'JSON_PARSE|{p}|{e}')

          # Parse XML-ish resources, including Adventure TMX maps.
          xml_count = 0
          for ext in ('*.xml', '*.tmx', '*.tsx'):
              for p in root.rglob(ext):
                  if '.git' in p.parts or 'target' in p.parts:
                      continue
                  xml_count += 1
                  try:
                      ET.parse(p)
                  except Exception as e:
                      errors.append(f'XML_PARSE|{p}|{e}')

          patterns = [
              ('STREAM_GET', re.compile(r'\.(?:findFirst|findAny)\(\)\.get\(\)')),
              ('OPTIONAL_GET', re.compile(r'\bOptional(?:<[^;>]+>)?[^;=]*=.*|\.get\(\)')),
              ('STRING_IDENTITY', re.compile(r'(?:==|!=)\s*"[^"\n]*"|"[^"\n]*"\s*(?:==|!=)')),
              ('EQUALS_NULL', re.compile(r'\.equals\(null\)')),
              ('GET_CARD_THEN_DEREF', re.compile(r'getCard\([^;]+;')),
          ]

          java_count = 0
          for p in root.rglob('*.java'):
              if '.git' in p.parts or 'target' in p.parts:
                  continue
              java_count += 1
              try:
                  lines = p.read_text(encoding='utf-8', errors='replace').splitlines()
              except Exception:
                  continue
              for i, line in enumerate(lines, 1):
                  stripped = line.strip()
                  if stripped.startswith('//') or stripped.startswith('*'):
                      continue
                  if patterns[0][1].search(line):
                      findings.append(f'STREAM_GET|{p}:{i}|{stripped}')
                  if patterns[2][1].search(line):
                      findings.append(f'STRING_IDENTITY|{p}:{i}|{stripped}')
                  if patterns[3][1].search(line):
                      findings.append(f'EQUALS_NULL|{p}:{i}|{stripped}')

              # Detect a narrow high-risk pattern: assign getCard(...) and dereference on next few lines
              for i, line in enumerate(lines):
                  m = re.search(r'\b(?:PaperCard|IPaperCard)\s+(\w+)\s*=.*\.getCard\(', line)
                  if not m:
                      continue
                  var = m.group(1)
                  window = '\n'.join(lines[i+1:i+6])
                  if re.search(rf'\b{re.escape(var)}\.(?:getRules|getName|getEdition|getImageKey)\s*\(', window) and not re.search(rf'\b{re.escape(var)}\s*==\s*null|Objects\.isNull\({re.escape(var)}\)', window):
                      findings.append(f'CARD_LOOKUP_DEREF|{p}:{i+1}|{line.strip()}')

          print(f'SCANNED|java={java_count}|json={json_count}|xml_tmx_tsx={xml_count}')
          print('=== RESOURCE ERRORS ===')
          for x in errors:
              print(x)
          print('=== JAVA CANDIDATES ===')
          for x in findings:
              print(x)
          print(f'SUMMARY|resource_errors={len(errors)}|java_candidates={len(findings)}')

          Path('dev-static-audit-report.txt').write_text(
              '\n'.join([
                  f'SCANNED java={java_count} json={json_count} xml_tmx_tsx={xml_count}',
                  'RESOURCE ERRORS:', *errors,
                  'JAVA CANDIDATES:', *findings,
                  f'SUMMARY resource_errors={len(errors)} java_candidates={len(findings)}',
              ]), encoding='utf-8')
          PY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: dev-static-audit-report
          path: dev-static-audit-report.txt

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and test
        shell: bash
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill $xvfb_pid 2>/dev/null || true' EXIT
          mvn -U -B clean test
